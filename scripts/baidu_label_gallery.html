<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baidu 数据集 · 标注质量浏览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111923;color:#e5edf5;font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif}header{padding:20px 26px;border-bottom:1px solid #344354}h1{font-size:24px;margin:0 0 8px}p{margin:7px 0;color:#bac9d9}button,input,select{font:inherit;background:#213144;border:1px solid #54708a;border-radius:5px;color:#fff;padding:7px}button{cursor:pointer}button:hover{background:#38516b}nav{display:flex;gap:10px;flex-wrap:wrap;padding:14px 26px;align-items:center}main{display:grid;grid-template-columns:minmax(400px,1.5fr) minmax(340px,1fr);gap:20px;padding:0 26px 24px}.panel{background:#1a2633;padding:16px;border-radius:8px;overflow:hidden}canvas{display:block;max-width:100%;height:auto;background:#070b10}#crop{image-rendering:pixelated}h2{font-size:17px;margin:0 0 12px}code{color:#a9dbff;overflow-wrap:anywhere}pre{white-space:pre-wrap;word-break:break-all;font:12px/1.6 monospace}label{white-space:nowrap}#list{max-height:260px;overflow:auto;border:1px solid #42546a}#list button{display:block;width:100%;text-align:left;border:0;border-radius:0;font-size:13px}#list .selected{background:#3b5f7e}.badge{color:#91f2bc}#review{width:100%;margin-top:10px}#empty{color:#ffbb80}@media(max-width:900px){main{grid-template-columns:1fr}header,nav,main{padding-left:14px;padding-right:14px}}
</style>
<header><h1>Baidu 数据集 · 标注质量浏览</h1><p id="counts"></p><p>绿色：训练标注框；红色：标注框几何中心。这里没有模型预测。局部图为原图无损 PNG，默认最近邻放大 4 倍，可隐藏框线检查球的真实轮廓。</p><p>全图为 JPEG 场景预览；局部图用于检查原始像素。抽样含随机和极值样本，不能据此估计整个数据集错误率。</p></header>
<nav><select id="group"><option value="all">全部来源</option><option value="new">本次有效新增</option><option value="used">此前已经使用</option></select><input id="search" placeholder="搜索文件名 / 抽样原因"><button id="prev">← 上一张</button><button id="next">下一张 →</button><span id="position"></span><label><input type="checkbox" id="boxes" checked>标注框</label><label><input type="checkbox" id="centers" checked>球心</label><button id="export">导出待复查清单</button><span id="empty"></span></nav>
<main><section class="panel"><h2 id="title"></h2><canvas id="full" width="1280" height="1024"></canvas><p id="reason"></p><div id="list"></div></section><section class="panel"><h2>原始像素局部图</h2><p><label>目标 <select id="object"></select></label> <label>放大 <select id="zoom"><option value="2">2 倍</option><option value="4" selected>4 倍</option><option value="6">6 倍</option></select></label></p><canvas id="crop" width="384" height="384"></canvas><p id="objectstats"></p><label><input type="checkbox" id="flag">加入待复查</label><input id="review" placeholder="复查备注，如框偏大、中心偏左、疑似漏标"><p>标记保存在当前浏览器。可导出 JSON；页面不会修改标签。</p><pre id="metadata"></pre></section></main>
<script>
const DATA=__PAYLOAD__;
const $=id=>document.getElementById(id), items=DATA.samples;
let filtered=items.slice(), current=filtered[0], serial=0;
let notes={};try{notes=JSON.parse(localStorage.getItem('baidu-label-review-v1')||'{}')}catch(e){}
$('counts').textContent=`全源 ${Object.values(DATA.statistics).reduce((n,s)=>n+s.images,0).toLocaleString()} 张；本页 ${items.length} 张（新增 ${items.filter(s=>s.group==='new').length} / 已用 ${items.filter(s=>s.group==='used').length}），随机种子 ${DATA.seed}。`;
const reasons={random_prefix_stratified:'按文件名前缀分层随机',smallest_box_area:'最小框',largest_box_area:'最大框',elongated_box:'长条框',multiple_objects_or_edge:'多球 / 边缘目标'};
function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}
function overlay(ctx,s,ox=0,oy=0,scale=1){ctx.save();ctx.lineWidth=1;ctx.font='14px sans-serif';s.boxes_xywh_px.forEach(([x,y,w,h],i)=>{let cx=(x-ox)*scale,cy=(y-oy)*scale;if($('boxes').checked){ctx.strokeStyle='#00ff8c';ctx.strokeRect((x-w/2-ox)*scale,(y-h/2-oy)*scale,w*scale,h*scale);ctx.fillStyle='#00ff8c';ctx.fillText(String(i+1),cx+w*scale/2+3,cy-h*scale/2)}if($('centers').checked){ctx.strokeStyle='#ff5959';ctx.beginPath();ctx.moveTo(cx-9,cy);ctx.lineTo(cx-4,cy);ctx.moveTo(cx+4,cy);ctx.lineTo(cx+9,cy);ctx.moveTo(cx,cy-9);ctx.lineTo(cx,cy-4);ctx.moveTo(cx,cy+4);ctx.lineTo(cx,cy+9);ctx.stroke()}});ctx.restore()}
async function render(){if(!current)return;let token=++serial,s=current;const obj=Math.min(Number($('object').value)||0,s.crops.length-1),c=s.crops[obj],z=Number($('zoom').value);try{const [full,part]=await Promise.all([loadImage(s.full),loadImage(c.image)]);if(token!==serial)return;const a=$('full'),b=$('crop');a.width=s.width;a.height=s.height;a.getContext('2d').drawImage(full,0,0);overlay(a.getContext('2d'),s);b.width=c.side*z;b.height=c.side*z;const ctx=b.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(part,0,0,b.width,b.height);overlay(ctx,s,c.left,c.top,z);const [x,y,w,h]=s.boxes_xywh_px[obj];$('objectstats').textContent=`目标 ${obj+1}：宽 ${w.toFixed(2)} × 高 ${h.toFixed(2)} px；标注框中心 (${x.toFixed(2)}, ${y.toFixed(2)})；局部 ${c.side}×${c.side} 原始像素。`;$('empty').textContent=''}catch(e){$('empty').textContent='图片显示失败，请重新打开完整 HTML。'}}
function show(s){if(!s)return;current=s;$('title').textContent=`#${s.id} ${s.name} · ${s.group==='new'?'本次新增':'此前已用'}`;$('reason').textContent='抽样原因：'+s.reason.map(r=>reasons[r]||r).join('、');$('object').replaceChildren(...s.boxes_xywh_px.map((b,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1} / ${s.boxes_xywh_px.length}`;return o}));$('position').textContent=`${filtered.indexOf(s)+1} / ${filtered.length}`;$('flag').checked=Boolean(notes[s.sha256]);$('review').value=notes[s.sha256]?.note||'';$('metadata').textContent=JSON.stringify({文件:s.name,来源:s.group==='new'?'新增train':'已有additional_v1 train',原图尺寸:[s.width,s.height],原始XML:s.xml_boxes,训练框中心宽高:s.boxes_xywh_px,源图片:s.source_image,源标注:s.source_annotation,备份图片:s.backup_image,SHA256:s.sha256},null,2);render();drawList()}
function drawList(){const list=$('list');list.replaceChildren(...filtered.map(s=>{let b=document.createElement('button');b.textContent=`#${s.id} ${s.group==='new'?'新增':'已用'} · ${s.name} · ${s.boxes_xywh_px.length}球${notes[s.sha256]?' ★':''}`;if(s===current)b.className='selected';b.onclick=()=>show(s);return b}))}
function filter(){const q=$('search').value.toLowerCase();filtered=items.filter(s=>($('group').value==='all'||s.group===$('group').value)&&(s.name+' '+s.reason.map(r=>reasons[r]||r).join(' ')).toLowerCase().includes(q));if(!filtered.length){serial++;$('position').textContent='没有匹配样本';$('empty').textContent='请修改搜索条件';drawList();return}show(filtered.includes(current)?current:filtered[0])}
function move(d){if(!filtered.length)return;show(filtered[(filtered.indexOf(current)+d+filtered.length)%filtered.length])}
function save(){if(!current)return;if($('flag').checked)notes[current.sha256]={id:current.id,name:current.name,source_image:current.source_image,backup_image:current.backup_image,sha256:current.sha256,note:$('review').value};else delete notes[current.sha256];try{localStorage.setItem('baidu-label-review-v1',JSON.stringify(notes))}catch(e){$('empty').textContent='浏览器未允许本地保存，请及时导出清单'}drawList()}
$('group').onchange=filter;$('search').oninput=filter;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);['boxes','centers','object','zoom'].forEach(id=>$(id).onchange=render);$('flag').onchange=save;$('review').oninput=()=>{if($('review').value)$('flag').checked=true;save()};$('export').onclick=()=>{const payload={dataset:'pingpong_baidu_out_v1_source',annotation_edits_applied:false,items:Object.values(notes)},url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='baidu_label_review_flags.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});show(current);
</script></html>
